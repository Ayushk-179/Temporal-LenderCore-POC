# POC logging. Readable in a terminal during a live demo.
#
#   LOG_RAW=false                      suppress full request/response bodies
#   -Dorg.slf4j.simpleLogger.log.com.rupeek.poc.temporal.config.store=debug
#                                      trace every config document read
org.slf4j.simpleLogger.defaultLogLevel=info
org.slf4j.simpleLogger.showDateTime=true
org.slf4j.simpleLogger.dateTimeFormat=HH:mm:ss.SSS
org.slf4j.simpleLogger.showShortLogName=true
org.slf4j.simpleLogger.showThreadName=false
org.slf4j.simpleLogger.levelInBrackets=true

# Framework chatter — errors still surface.
org.slf4j.simpleLogger.log.io.temporal=warn
org.slf4j.simpleLogger.log.io.grpc=warn
org.slf4j.simpleLogger.log.io.netty=warn
org.slf4j.simpleLogger.log.com.mongodb=warn
org.slf4j.simpleLogger.log.org.mongodb=warn
